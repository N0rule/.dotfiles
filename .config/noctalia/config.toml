# Native Noctalia snapshot, 2026-10-05; exported from GUI settings.
# GUI overrides in ~/.local/state/noctalia/settings.toml take precedence.
config_version = 14

[audio]
enable_overdrive = true

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.79999998211860657
    capsule = true
    center = [ "workspaces" ]
    end = [
        "tray",
        "cat_2",
        "keyboard_layout",
        "battery",
        "volume",
        "bluetooth",
        "network",
        "clock",
        "weather",
        "control-center",
        "session"
    ]
    margin_ends = 25
    start = [ "launcher", "clipboard", "notifications", "active_window", "media", "recorder_2" ]

[battery]
warning_threshold = 30

[brightness]
enable_ddcutil = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 240

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 1
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 741.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 465.0
    cy = 862.0
    output = "winit"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugin_settings."noctalia/screen_recorder"]
video_source = "portal"

[plugins]
auto_update = "all"
enabled = [ "noctalia/screen_recorder", "noctalia/bongocat" ]

[shell]
avatar_path = "~/Pictures/Dotfiles/ProfileIcon.png"
button_borders = false
card_borders = false
input_borders = false
popup_borders = false
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = false

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    remember_last_region = true
    save_to_file = false

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "sway" ]
    community_ids = [ "brave-origin", "discord", "telegram", "neovim", "zed", "steam", "bat", "yazi" ]

[wallpaper]
directory = "~/Pictures/Dotfiles"

    [wallpaper.default]
    path = "~/Pictures/Dotfiles/Nanachi-Splash.png"

    [wallpaper.last]
    path = "~/Pictures/Dotfiles/Nanachi-Splash.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Pictures/Dotfiles/Nanachi-Splash.png"

    [[wallpaper.favorite]]
    builtin_palette = "Catppuccin"
    palette_source = "builtin"
    path = "~/Pictures/Dotfiles/Nanachi-Splash.png"
    theme_mode = "dark"

[widget.active_window]
min_length = 10

[widget.battery]
hide_when_plugged = true

[widget.cat_2]
input_devices = [ "/dev/input/by-id/keyd-virtual-keyboard" ]
type = "noctalia/bongocat:cat"

[widget.control-center]
custom_image = "~/Pictures/Dotfiles/ProfileIcon.png"

[widget.media]
hide_when_no_media = true
min_length = 10

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.recorder_2]
type = "noctalia/screen_recorder:recorder"

[widget.weather]
show_condition = false
