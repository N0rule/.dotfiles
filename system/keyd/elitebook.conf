# Opt-in profile copied from this HP EliteBook's /etc/keyd/default.conf.
# This replaces the pass-through profile; do not install both as *.conf files.
[ids]
*

[main]
# Monitor button -> terminal (Ctrl+Alt+T).
leftcontrol+leftalt+f22 = macro(C-A-t)
# Answer button -> region screenshot (Ctrl+Shift+1).
leftmeta+leftalt+f22 = macro(C-S-1)
# Hangup button -> close window (Super+Q).
leftcontrol+leftalt+f23 = macro(leftmeta+q)
